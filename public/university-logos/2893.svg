</style><script type="module" src="/_astro/hoisted.inoXx_pf.js"></script></head> <body> <header class="flex m-0 px-2 bg-gray-900 h-20"> <nav class="flex items-center justify-between pl-16"> <div class="m-0"> <a class="text-amber-400 text-2xl font-bold" href="https://cheaphotelguide.com/de/">Cheap Hotel Guide</a> </div> </nav> </header> <main class="flex justify-center m-0 p-4"> <div class="flex-1 text-xl leading-normal p-8 min-w-3xl max-w-4xl text-slate-900"> <div class="mb-4 py-4 text-center leading-none"> <h1 class="text-3xl mb-2">Evangelische Hochschule Moritzburg: Aktuelle Nachrichten und Informationen - Günstige Hotels</h1> <hr> </div>  <div><pre><h2>STARTSEITE</h2>
<p>EHM besucht den Spielmarkt Potsdam</p>
<p>Am 29. April besuchten 50 Studierende unserer Hochschule zusammen mit Prof. Dr. Martin Steinhäuser den 26. Internationalen Spielmarkt in Potsdam. Sie nahmen an Workshops teil, informierten sich über neue Trends und Materialien und probierten vieles selber aus. Wie man auf dem Foto sehen kann (ein gruppendynamisches Spielmittel mit dem Namen &#8220;le bonbond&#8221; &#8211; &#8220;das gute Band&#8221;), konnte dies auch sehr entspannend sein!</p>
<p>Eine Besonderheit des diesjährigen Spielmarkt-Besuches war, dass mit Catja Donner und Oliver Thunig zwei Studierende unserer Hochschule ihr eigenes Forschungsprojekt zum Thema &#8220;Wettbewerbsfreies oder wettbewerbsorientiertes Spielen?&#8221; als Workshop vorstellen konnten.</p>
<h2>Flüchtlinge – Moritzburg – EHM</h2>
<p>Ein Hochschultag für Information, Kommunikation und Planung</p>
<p>Aus aktuellem Anlass widmete die Evangelische Hochschule Moritzburg ihren turnusmäßigen Studientag am 25. November zu einem „Hochschultag“ um. Nicht um die akademische und konzeptionelle Reflexion eines religionspädagogischen Themas sollte es gehen, sondern um eine hochschulinterne Verständigung. Der Anlass lag auf der Hand.</p>
<h2>Personelle Veränderungen an der EHM</h2>
<p>Dr. Thomas Knittel, seit 2007 Professor für Theologie sowie Leiter des Instituts für Berufsbegleitende Studien (IBS) an unserer Hochschule, hat am 1. Februar 2016 das Amt des Vorstehers der Gemeinschaft Moritzburger Diakone und Diakoninnen übernommen. Der bisherige Vorsteher, Pfarrer Friedrich Drechsler, ist in den Ruhestand verabschiedet worden.</p>
<p>Herr Dr. Knittel hat in diesem Zusammenhang die Leitung des IBS abgegeben. Das IBS wird seit Januar 2016 von Dozent Tobias Petzoldt geleitet.</p>
<h2>Bildungsspender</h2>
<p>Unterstützen Sie Projekte an der Evangelischen Hochschule Moritzburg, indem Sie den Bldungsspender nutzen. So funktioniert es.</p>
<h2>Humanität ist Gottes Gebot der Stunde</h2>
<p>Erklärung der Hochschulleitung aus Anlass der PEGIDA-Aktivitäten</p>
<p>Die Würde des Menschen ist unantastbar. Sie zu achten und zu schützen ist Verpflichtung aller staatlichen Gewalt.</p>
<p>Die Evangelische Hochschule Moritzburg als eine Institution der akademischen Bildung ist den Werten des Abendlandes und der europäischen Aufklärung verpflichtet. Die Achtung der Würde der Person ungeachtet von Herkunft, Religion oder Sexualität gehört zu den unveräußerlichen Fundamenten eines zivilisierten Miteinanders.</p>
<h2>Bildung und Erziehung in der Kindheit mit religionspädagogischem Profil</h2>
<p>Neuer Bachelor-Studiengang seit Wintersemester 2015/16</p>
<p>Die EHM bietet folgenden neuen Studiengang an:</p>
<p>Bildung und Erziehung in der Kindheit mit religionspädagogischem Profil (Bachelor of Arts).</p>
<p>Weitere Informationen finden Sie in den Menüpunkten Bachelorstudiengänge und Bewerbung.</p>
<h2>Masterstudium seit Februar 2015</h2>
<p>Seit Februar 2015 kann an der Evangelischen Hochschule Moritzburg ein Master of Arts im Studienfach „Evangelische Religionspädagogik“ erworben werden:</p>
<p>1) In drei Semestern als konsekutiv grundständiges Studium</p>
<p>oder</p>
<p>2) als Weiterbildungsmaster, und zwar</p>
<p>&#8211; entweder berufsbegleitend in fünf oder sechs Semestern</p>
<p>&#8211; oder als Vollzeitstudium in drei Semestern.</p>
<p>Die Masterstudiengänge beginnen jeweils im Sommersemester. Nächster Studienbeginn ist am 25. Januar 2016.</p>
<h2>ERASMUS-Programm 2014-2020</h2>
<p>Die Evangelische Hochschule Moritzburg wurde für den Zeitraum von 2014 bis 2020 ins ERASMUS-Programm zur internationalen Hochschulkooperation aufgenommen.</p>
<p>Es bestehen Kooperationsverträge mit:</p>
<p>Und das sind die neuesten Nachrichten und Entwicklungen an der Evangelischen Hochschule Moritzburg. Falls Sie sich für weitere Informationen interessieren, besuchen Sie unsere Website oder kontaktieren Sie uns direkt.</p></pre><div class="flex my-8 flex-wrap pre-links"><a style="flex:0 0 33.3333%" href="https://cheaphotelguide.com/de/edinburgh/">Edinburgh Günstige Hotels</a><a style="flex:0 0 33.3333%" href="https://cheaphotelguide.com/de/watford/">Watford Günstige Hotels</a><a style="flex:0 0 33.3333%" href="https://cheaphotelguide.com/de/bristol/">Bristol Günstige Hotels</a><a style="flex:0 0 33.3333%" href="https://cheaphotelguide.com/de/bournemouth/">Bournemouth Günstige Hotels</a><a style="flex:0 0 33.3333%" href="https://cheaphotelguide.com/de/birmingham/">Birmingham Günstige Hotels</a><a style="flex:0 0 33.3333%" href="https://cheaphotelguide.com/de/cebu-city/">Cebu City Günstige Hotels</a><a style="flex:0 0 33.3333%" href="https://cheaphotelguide.com/de/boca_raton/">Boca Raton Günstige Hotels</a><a style="flex:0 0 33.3333%" href="https://cheaphotelguide.com/de/toronto/">Toronto Günstige Hotels</a><a style="flex:0 0 33.3333%" href="https://cheaphotelguide.com/de/newcastle-upon-tyne/">Newcastle upon Tyne Günstige Hotels</a><a style="flex:0 0 33.3333%" href="https://cheaphotelguide.com/de/blackpool/">Blackpool Günstige Hotels</a><a style="flex:0 0 33.3333%" href="https://cheaphotelguide.com/de/manchester/">Manchester Günstige Hotels</a><a style="flex:0 0 33.3333%" href="https://cheaphotelguide.com/de/aberdeen/">Aberdeen Günstige Hotels</a><a style="flex:0 0 33.3333%" href="https://cheaphotelguide.com/de/cardiff/">Cardiff Günstige Hotels</a><a style="flex:0 0 33.3333%" href="https://cheaphotelguide.com/de/banff/">Banff Günstige Hotels</a><a style="flex:0 0 33.3333%" href="https://cheaphotelguide.com/de/benidorm/">Benidorm Günstige Hotels</a><a style="flex:0 0 33.3333%" href="https://cheaphotelguide.com/de/glasgow/">Glasgow Günstige Hotels</a><a style="flex:0 